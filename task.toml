schema_version = "1.3"

[task]
name = "humanlaya/ingest-ledger-incident"
authors = [{ name = "humanlaya", email = "noreply@example.com" }]

[agent]
# 90 分钟：本题需要从样本逆推 journal 重放语义（事务边界、放弃事务、紧邻重试
# 去重、压缩检查点），实现增量 tail-follow 与并发/flock 语义，再处理现场缺陷；
# 前序任务的筛选模型曾在 1800 秒与 3600 秒预算内均未能完成作答，本题探索成本
# 相当，沿用 5400 秒为较慢的候选模型留足执行时间。难度门只约束得分，不约束用时。
timeout_sec = 5400

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true

[verifier]
timeout_sec = 600

[metadata]
difficulty = "hard"
category = "chaotic-environment"
tags = ["linux", "troubleshooting", "ops", "logging", "data-engineering"]
